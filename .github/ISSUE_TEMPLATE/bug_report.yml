name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time! A detailed description helps a lot.
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: Shown in the serial log at start ("App version")
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: What the display showed, which buttons you pressed, the priority of the message.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Serial log
      description: Output of `idf.py monitor`, if you have it. Remove your Pushover secret and device ID.
      render: text
